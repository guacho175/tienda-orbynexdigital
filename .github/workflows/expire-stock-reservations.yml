name: Expire stock reservations

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expire-stock-reservations
  cancel-in-progress: false

jobs:
  expire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call expiration endpoint
        env:
          APP_URL: https://tienda-orbynexdigital.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_URL"
          test -n "$CRON_SECRET"

          curl --fail-with-body --show-error --silent --retry 3 --retry-delay 5 \
            --request GET \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/stock/expire-reservations"
