<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirma tu cuenta</title>
  </head>
  <body style="margin:0;background:#f6f8fb;color:#111827;font-family:Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #e5e7eb;border-radius:12px;padding:32px;">
            <tr>
              <td>
                <h1 style="margin:0 0 12px;font-size:24px;line-height:1.25;color:#111827;">
                  Confirma tu cuenta
                </h1>
                <p style="margin:0 0 20px;font-size:16px;line-height:1.6;color:#374151;">
                  Confirma este correo para activar tu perfil y cargar de forma segura los pedidos asociados a esta direccion.
                </p>
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#0ea5e9;color:#ffffff;text-decoration:none;font-weight:700;border-radius:999px;padding:12px 20px;">
                  Confirmar correo
                </a>
                <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#6b7280;">
                  Si no creaste esta cuenta, puedes ignorar este mensaje.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
